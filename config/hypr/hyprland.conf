# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,preferred,auto,auto
monitor=eDP-1,1920x1080@144,0x0,1

# For HDMI output
monitor=,preferred,auto,1,mirror,eDP-1 

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = nemo
$menu = wofi --show drun

#################
### AUTOSTART ###
#################

# Some apps
exec-once = zen-browser & Telegram
# exec-once = waybar -c ~/.config/waybar/waybar-short/config -s ~/.config/waybar/waybar-short/style.css
exec-once = waybar -c ~/.config/waybar/waybar-long/config.json -s ~/.config/waybar/waybar-long/style.css
exec-once = dunst
# exec-once = [workspace 2] kitty neofetch
exec-once = [workspace 3] kitty fish -c "mux"
exec-once = syncthing

# Polkit user password prompt
exec-once = systemctl --user start hyprpolkitagent

# Wallpapers
exec-once = swww-daemon
# exec-once = swww img ~/Pictures/nord.webp
exec-once = swww img ~/Pictures/observer.png

# cursor theme
exec-once = hyprctl setcursor Catppuccin-Mocha-Blue-Cursors 28

# clipboard
exec-once = wl-paste --type text --watch cliphist store #Stores only text data
exec-once = wl-paste --type image --watch cliphist store #Stores only image data

# night light
exec-once = hyprsunset

# GTK theme
exec-once = gsettings set org.gnome.desktop.interface cursor-size 28   # for GTK4 apps
exec-once = gsettings set org.gnome.desktop.interface gtk-theme Catppuccin-Dark   # for GTK3 apps
exec-once = gsettings set org.gnome.desktop.interface cursor-theme Catppuccin-Mocha-Blue-Cursors    # for GTK4 apps
exec-once = gsettings set org.gnome.desktop.interface icon-theme Catppuccin-Mocha-Alt2

# Hypridle
exec-once = hypridle


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,28
env = XCURSOR_THEME,Catppuccin-Mocha-Blue-Cursors
env = HYPRCURSOR_SIZE,28
env = HYPRCURSOR_THEME,Catppuccin-Mocha-Blue-Cursors

env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
# env = LIBVA_DRIVER_NAME,nvidia
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = __NV_PRIME_RENDER_OFFLOAD,1
env = __VK_LAYER_NV_optimus,NVIDIA_only
env = ELECTRON_OZONE_PLATFORM_HINT,auto

env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_QPA_PLATFORM,wayland;xcb

cursor {
    no_hardware_cursors = true
}


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general { 
    gaps_in = 5
    gaps_out = 15

    border_size = 0

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(81a1c1ee)
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true 

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    blur {
        enabled = false
        size = 10
        passes = 1
        new_optimizations = true
        brightness = 1
    }
    rounding = 10
 
    # inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 25
        render_power = 2
        color = rgba(00000034)
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 4, myBezier
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 5, default
    animation = borderangle, 1, 4, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 3, default
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc { 
    force_default_wallpaper = 1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
    vfr = true
    vrr = 1
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us,ru
    kb_variant =,,phonetic
    kb_model =
    kb_options = grp:win_space_toggle,grp:alt_shift_toggle
    kb_rules =

    follow_mouse = 1

    sensitivity = 0.1 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        disable_while_typing = false
    }

}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
# gestures {
#     workspace_swipe = true
# }
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


####################
### KEYBINDINGSS ###
####################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
# bind = $mainMod, RETURN, exec, [tile] $terminal
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod, P, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mainMod, F, fullscreen
bind = $mainMod, I, pin
bind = ALT, TAB, cyclenext
bind = ALT, Tab, bringactivetotop

# Screenshots
# Screenshot a window
bind = $mainMod, PRINT, exec, hyprshot -m window --clipboard-only
# Screenshot a monitor
bind = , PRINT, exec, hyprshot -m output --clipboard-only
# Screenshot a region
bind = SHIFT, PRINT, exec, hyprshot -m region --clipboard-only


# brightness settigns
# binde =, XF86MonBrightnessDown, exec, swayosd-client --brightness -10
# binde =, XF86MonBrightnessUp, exec, swayosd-client --brightness +10
bindel =, XF86MonBrightnessDown, exec, brightnessctl set 10%-
bindel =, XF86MonBrightnessUp, exec, brightnessctl set +10%

# Volume settings
bindel =, XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +10%
bindel =, XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -10%
bindl =, XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindl =, XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SINK@ toggle

# binde =, XF86AudioRaiseVolume, exec, swayosd-client --output-volume +10
# binde =, XF86AudioLowerVolume, exec, swayosd-client --output-volume -10
# bind =, XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
# bind =, XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SINK@ toggle

# Night light mode
bindel = $mainMod, Up, exec, hyprctl hyprsunset temperature -500
bindel = $mainMod, Down, exec, hyprctl hyprsunset temperature +500 

# Log out menu
bind = $mainMod SHIFT, E, exec, wlogout

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspacesilent, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up, workspace, e+1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


